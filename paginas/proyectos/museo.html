<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="base-depth" content="2">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museo — Andrés Galdino</title>
  <meta name="description" content="Colección y archivo de obras visuales — un museo personal en formato digital.">
  <meta property="og:title" content="Museo — Andrés Galdino">
  <meta property="og:image" content="/assets/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/main.css">
  <style>
    html, body { height: 100%; overflow: hidden; background: #080810; }
    .cursor { background: #fff !important; mix-blend-mode: difference !important; }

    .museo-bg {
      position: fixed; inset: 0;
      background-image: url('../../assets/museo.jpg');
      background-size: cover; background-position: center;
      filter: blur(5px) brightness(.50) saturate(0);
      transform: scale(1.06); z-index: 0;
    }

    /* ── Back ── */
    .museo-back {
      position: fixed; top: calc(var(--nh) + 20px); left: 24px; z-index: 200;
      font-size: 10px; font-weight: 600; letter-spacing: .14em;
      text-transform: uppercase; color: rgba(255,255,255,.28);
      text-decoration: none; cursor: none;
      background: rgba(255,255,255,.06);
      border: .5px solid rgba(255,255,255,.1);
      border-radius: 999px; padding: 8px 16px;
      transition: color .2s, background .2s;
    }
    .museo-back:hover { color: rgba(255,255,255,.7); background: rgba(255,255,255,.1); }

    /* ── Sidebar ── */
    .museo-sidebar {
      position: fixed; left: 24px;
      top: calc(var(--nh) + (100vh - var(--nh)) / 2);
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 4px;
      background: rgba(255,255,255,.06);
      border: .5px solid rgba(255,255,255,.1);
      border-radius: 999px; padding: 12px 8px; z-index: 200;
    }
    .sidebar-btn {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; color: rgba(255,255,255,.4);
      cursor: none; transition: color .2s, background .2s;
    }
    .sidebar-btn:hover { color: #fff; background: rgba(255,255,255,.1); }

    /* ── Layout ── */
    .museo-wrap {
      position: fixed;
      top: var(--nh); left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 12px 0 16px;
      gap: 0; z-index: 1;
    }

    /* ── Carrusel ── */
    .carousel-wrap {
      flex: 1; width: 100%;
      display: flex; align-items: center; justify-content: center;
      perspective: 1200px;
      position: relative;
    }
    .carousel {
      position: relative; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }

    /* Cards — GPU acelerado, transición suave */
    .museo-card {
      position: absolute;
      width: clamp(300px, 32vw, 480px);
      border-radius: 20px; overflow: hidden;
      cursor: none;
      will-change: transform, opacity;
      transition:
        transform  .7s cubic-bezier(.25,.8,.25,1),
        opacity    .7s cubic-bezier(.25,.8,.25,1);
      border: .5px solid rgba(255,255,255,.14);
      transform-style: preserve-3d;
    }

    /* Overlay oscuro para las cards laterales — evita animar filter (pesado) */
    .museo-card::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(0,0,0,0);
      transition: background .7s cubic-bezier(.25,.8,.25,1);
      pointer-events: none; z-index: 10;
    }

    .museo-card.pos-active {
      transform: translate3d(0,0,0) scale(1) rotateY(0deg);
      z-index: 10; opacity: 1;
      box-shadow: 0 40px 80px rgba(0,0,0,.65);
    }
    .museo-card.pos-active::after { background: rgba(0,0,0,0); }

    .museo-card.pos-left {
      transform: translate3d(-52%,0,-120px) rotateY(14deg) scale(.82);
      z-index: 5; opacity: 1;
    }
    .museo-card.pos-left::after { background: rgba(0,0,0,.52); }

    .museo-card.pos-right {
      transform: translate3d(52%,0,-120px) rotateY(-14deg) scale(.82);
      z-index: 5; opacity: 1;
    }
    .museo-card.pos-right::after { background: rgba(0,0,0,.52); }

    .museo-card.pos-far-left {
      transform: translate3d(-80%,0,-220px) rotateY(22deg) scale(.6);
      z-index: 2; opacity: 0; pointer-events: none;
    }
    .museo-card.pos-far-right {
      transform: translate3d(80%,0,-220px) rotateY(-22deg) scale(.6);
      z-index: 2; opacity: 0; pointer-events: none;
    }
    .museo-card.pos-hidden {
      transform: translate3d(0,0,-300px) scale(.4);
      z-index: 0; opacity: 0; pointer-events: none;
    }

    .card-image { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; }

    .card-glass {
      background: rgb(40, 40, 40);
      border-top: .5px solid rgba(255,255,255,.1);
      padding: 14px 16px 16px;
    }
    .card-title { font-size: clamp(12px,1.3vw,15px); font-weight: 700; color: #fff; letter-spacing: -.02em; margin-bottom: 4px; }
    .card-date  { font-size: 9px; font-weight: 400; color: rgba(255,255,255,.28); margin-left: 6px; }
    .card-quote { font-size: 10px; color: rgba(255,255,255,.42); line-height: 1.6; font-style: italic; margin-bottom: 8px; }
    .card-meta  { font-size: 9px; color: rgba(255,255,255,.24); line-height: 1.7; }

    .card-top-btns { position: absolute; top: 10px; right: 10px; z-index: 11; }
    .card-expand-btn {
      background: rgba(255,255,255,.12); border: .5px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px; padding: 5px 11px;
      font-family: var(--font); font-size: 9.5px; font-weight: 600;
      color: rgba(255,255,255,.8); cursor: none;
      display: flex; align-items: center; gap: 4px;
      transition: background .15s;
    }
    .card-expand-btn:hover { background: rgba(255,255,255,.22); }

    /* ── Music player — compacto ── */
    .music-player {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,.07);
      border: .5px solid rgba(255,255,255,.11);
      border-radius: 999px;
      padding: 7px 16px;
      margin: 14px 0 10px;
    }
    .mp-icon { color: rgba(255,255,255,.35); display: flex; align-items: center; }
    .mp-label { font-size: 10px; font-weight: 500; color: rgba(255,255,255,.38); letter-spacing: .06em; }
    .mp-btn {
      background: rgba(255,255,255,.1); border: .5px solid rgba(255,255,255,.15);
      border-radius: 50%; width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      cursor: none; color: rgba(255,255,255,.7); transition: background .15s;
    }
    .mp-btn:hover { background: rgba(255,255,255,.2); color: #fff; }
    .mp-bar-wrap { width: 80px; height: 2px; background: rgba(255,255,255,.14); border-radius: 999px; overflow: hidden; }
    .mp-bar-fill { height: 100%; background: rgba(255,255,255,.55); width: 0%; border-radius: 999px; transition: width .5s linear; }
    .mp-sep { width: .5px; height: 14px; background: rgba(255,255,255,.1); }
    input[type=range].mp-vol {
      -webkit-appearance: none; appearance: none;
      width: 54px; height: 2px;
      background: rgba(255,255,255,.18); border-radius: 999px;
      outline: none; cursor: pointer;
    }
    input[type=range].mp-vol::-webkit-slider-thumb {
      -webkit-appearance: none; width: 10px; height: 10px;
      background: rgba(255,255,255,.8); border-radius: 50%; cursor: pointer;
    }

    /* ── Dots ── */
    .museo-dots {
      flex-shrink: 0;
      display: flex; gap: 10px; align-items: center;
      margin-bottom: 10px;
    }
    .museo-dot {
      height: 3px; border-radius: 999px;
      background: rgba(255,255,255,.18); width: 16px; cursor: none;
      transition: all .4s cubic-bezier(.25,.8,.25,1);
    }
    .museo-dot.active { background: rgba(255,255,255,.8); width: 30px; }

    /* ── Lightbox — negro sólido, sin blur ── */
    @keyframes lbIn { from { opacity:0; } to { opacity:1; } }
    .lightbox {
      position: fixed; inset: 0; z-index: 9999;
      background: #000;
      isolation: isolate;
      display: none; align-items: center; justify-content: center;
    }
    .lightbox.open { display: flex; animation: lbIn .3s ease; }
    .lightbox-img { max-width: 88vw; max-height: 88vh; object-fit: contain; border-radius: 12px; }
    .lightbox-close {
      position: fixed; top: 20px; right: 24px;
      background: rgba(255,255,255,.07); border: .5px solid rgba(255,255,255,.12);
      border-radius: 999px; padding: 8px 18px;
      font-family: var(--font); font-size: 10px; font-weight: 600;
      color: rgba(255,255,255,.5); cursor: none;
      transition: background .15s, color .15s;
    }
    .lightbox-close:hover { background: rgba(255,255,255,.14); color: #fff; }
  </style>
</head>
<body>
<div id="nav-container"></div>
<div class="cursor" id="cursor" aria-hidden="true"></div>
<div class="museo-bg"></div>

<a class="museo-back" href="../proyectos.html">← Proyectos</a>

<div class="museo-sidebar">
  <button class="sidebar-btn" id="favBtn" aria-label="Me gusta">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
  </button>
  <button class="sidebar-btn" aria-label="Sobre mí" onclick="window.location='../sobre-mi.html'">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
  </button>
</div>

<div class="museo-wrap">
  <div class="carousel-wrap">
    <div class="carousel" id="carousel"></div>
  </div>

  <!-- Reproductor compacto -->
  <div class="music-player">
    <div class="mp-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg></div>
    <span class="mp-label">Ambiente</span>
    <button class="mp-btn" id="musicPlay" aria-label="Play/Pausa">
      <svg id="icPlay"  width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
      <svg id="icPause" width="9" height="9" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
    </button>
    <div class="mp-bar-wrap"><div class="mp-bar-fill" id="mpFill"></div></div>
    <div class="mp-sep"></div>
    <input type="range" class="mp-vol" id="volSlider" min="0" max="1" step="0.05" value="0.5">
    <audio id="museumAudio" loop src="../../assets/museo-ambient.mp3" preload="auto"></audio>
  </div>

  <!-- Dots -->
  <div class="museo-dots" id="museoDots"></div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕ Cerrar</button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
</div>

<script src="../../js/loader.js"></script>
<script>
(function () {
  'use strict';

  var pieces = [
    { img: '../../assets/modelo.jpg', title: 'Amazonas Fashion week',         date: '2019', quote: '"De la selva amazónica a una identidad visual que el mundo desea."', medium: 'Fotografía',       client: 'Moda Week International' },
    { img: '../../assets/irene.jpg',      title: 'Amazonas Fashion Week',  date: '2019', quote: '"Moda, cultura y amazonía en un solo evento visual."',                medium: 'Fotografía · Producción',client: 'Moda Week International' },
    { img: '../../assets/michell.jpg',      title: 'Amazonas Fashion Week',  date: '2019', quote: '"Moda, cultura y amazonía en un solo evento visual."',                medium: 'Fotografía · Producción',client: 'Moda Week International' },
    { img: '../../assets/nativa.jpg',  title: 'Nativa',                 date: '2020', quote: '"marca de ropa pieza identidad visual"',   medium: 'Grafic design',     client: 'Nativa Store' },
    { img: '../../assets/proj-04-chiper.jpg',         title: 'Chiper',                 date: '2022', quote: '"Piezas para las marcas más grandes de Colombia."',                   medium: 'Diseño Gráfico · Campañas',         client: 'Chiper · B2B Platform' },
    { img: '../../assets/proj-05-farmalaxia.jpg',     title: 'Farmalaxia',             date: '2023', quote: '"Donde la medicina encuentra la inteligencia."',                      medium: 'Brand Identity · Manual de Marca',  client: 'Farmalaxia' },
    { img: '../../assets/proj-06-dreams.jpg',         title: 'Dreams',                 date: '2025', quote: '"Un videojuego sobre exploración, construcción y sueños."',           medium: 'Game Design · Unity',               client: 'Proyecto Personal' },
    { img: '../../assets/proj-07-museo.jpg',          title: 'El Espacio',             date: '2024', quote: '"La fotografía como forma de ver lo que otros ignoran."',             medium: 'Fotografía Editorial',              client: 'Archivo Personal' }
  ];

  var current    = 0;
  var total      = pieces.length;
  var isAnimating = false;          /* Debounce — evita trabarse */
  var ANIM_MS    = 680;

  var carousel = document.getElementById('carousel');
  var dotsEl   = document.getElementById('museoDots');
  var lightbox = document.getElementById('lightbox');
  var lbImg    = document.getElementById('lightboxImg');

  /* ── Cards ── */
  pieces.forEach(function (p, i) {
    var card = document.createElement('div');
    card.className = 'museo-card';
    card.dataset.index = i;
    card.innerHTML =
      '<div class="card-top-btns">' +
        '<button class="card-expand-btn" data-expand>' +
          '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>' +
          'Expandir' +
        '</button>' +
      '</div>' +
      '<img class="card-image" src="' + p.img + '" alt="' + p.title + '" loading="lazy">' +
      '<div class="card-glass">' +
        '<div class="card-title">' + p.title + '<span class="card-date">' + p.date + '</span></div>' +
        '<p class="card-quote">' + p.quote + '</p>' +
        '<div class="card-meta">' + p.medium + '<br>' + p.client + '</div>' +
      '</div>';

    card.querySelector('[data-expand]').addEventListener('click', function (e) {
      e.stopPropagation();
      lbImg.src = p.img; lbImg.alt = p.title;
      lightbox.classList.add('open');
    });

    card.addEventListener('click', function () {
      var idx = parseInt(card.dataset.index);
      if (idx !== current) goTo(idx);
    });

    carousel.appendChild(card);
  });

  /* ── Dots ── */
  pieces.forEach(function (_, i) {
    var d = document.createElement('div');
    d.className = 'museo-dot';
    d.addEventListener('click', function () { goTo(i); });
    dotsEl.appendChild(d);
  });

  /* ── Posiciones ── */
  function getPos(i) {
    var diff = i - current;
    if (diff === 0)  return 'pos-active';
    if (diff === -1) return 'pos-left';
    if (diff === 1)  return 'pos-right';
    if (diff <= -2)  return 'pos-far-left';
    return 'pos-far-right';
  }

  function goTo(n) {
    if (isAnimating || n < 0 || n >= total) return;
    isAnimating = true;
    current = n;

    carousel.querySelectorAll('.museo-card').forEach(function (c, i) {
      c.className = 'museo-card ' + getPos(i);
    });
    dotsEl.querySelectorAll('.museo-dot').forEach(function (d, i) {
      d.classList.toggle('active', i === current);
    });

    /* Desbloquear después de que termine la animación */
    setTimeout(function () { isAnimating = false; }, ANIM_MS);
  }

  /* Teclado + swipe */
  document.addEventListener('keydown', function (e) {
    if (lightbox.classList.contains('open')) { if (e.key === 'Escape') lightbox.classList.remove('open'); return; }
    if (e.key === 'ArrowRight') goTo(current + 1);
    if (e.key === 'ArrowLeft')  goTo(current - 1);
  });
  var tx = 0;
  document.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend',   function (e) {
    var dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 50) goTo(dx < 0 ? current + 1 : current - 1);
  });

  document.getElementById('lightboxClose').addEventListener('click', function () { lightbox.classList.remove('open'); });
  lightbox.addEventListener('click', function (e) { if (e.target === lightbox) lightbox.classList.remove('open'); });

  goTo(0);

  /* ── Cursor ── */
  var cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', function (e) { cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px'; });
  window.addEventListener('load', function () {
    document.querySelectorAll('a, button, .museo-card, .museo-dot').forEach(function (el) {
      el.addEventListener('mouseenter', function () { cursor.classList.add('big'); });
      el.addEventListener('mouseleave', function () { cursor.classList.remove('big'); });
    });
  });

  /* ── Favorito ── */
  document.getElementById('favBtn').addEventListener('click', function () {
    var svg = this.querySelector('svg');
    var on  = svg.getAttribute('fill') !== 'none';
    svg.setAttribute('fill',   on ? 'none' : 'rgba(255,80,80,.85)');
    svg.setAttribute('stroke', on ? 'currentColor' : 'rgba(255,80,80,.85)');
  });

  /* ── Audio ── */
  var audio     = document.getElementById('museumAudio');
  var playBtn   = document.getElementById('musicPlay');
  var icPlay    = document.getElementById('icPlay');
  var icPause   = document.getElementById('icPause');
  var volSlider = document.getElementById('volSlider');
  var mpFill    = document.getElementById('mpFill');

  audio.volume = 0.5;

  function syncIcon() {
    icPlay.style.display  = audio.paused ? '' : 'none';
    icPause.style.display = audio.paused ? 'none' : '';
  }

  playBtn.addEventListener('click', function () {
    audio.paused ? audio.play().catch(function(){}) : audio.pause();
    syncIcon();
  });

  volSlider.addEventListener('input',  function () { audio.volume = parseFloat(this.value); });
  volSlider.addEventListener('change', function () { audio.volume = parseFloat(this.value); });

  audio.addEventListener('timeupdate', function () {
    if (audio.duration) mpFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
  });

  audio.play().then(syncIcon).catch(function () {
    function unlock() { audio.play().catch(function(){}); syncIcon(); document.removeEventListener('click', unlock); document.removeEventListener('touchstart', unlock); }
    document.addEventListener('click', unlock);
    document.addEventListener('touchstart', unlock);
  });

  var wasPlaying = false;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { wasPlaying = !audio.paused; if (wasPlaying) audio.pause(); }
    else { if (wasPlaying) audio.play().catch(function(){}); }
    syncIcon();
  });

  syncIcon();
})();
</script>
</body>
</html>
